name: arthuriq

services:
  api:
    build: .
    container_name: arthuriq_api
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arthuriq.entrypoints=websecure"
      - "traefik.http.routers.arthuriq.rule=Host(`api.arthuriq.com`)"
      - "traefik.http.routers.arthuriq.tls.certresolver=letsencrypt"
      - "traefik.http.services.arthuriq.loadbalancer.server.port=3002"

networks:
  default:
    name: shelfwise_default
    ipam:
      config:
        - subnet: 172.30.0.0/16
